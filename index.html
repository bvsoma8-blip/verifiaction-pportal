<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام التحقق من الوثائق والمستندات الرسمية</title>
    <!-- استيراد خطوط عربية ملكية ورسمية من جوجل -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        /* التنسيق العام للموقع */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: radial-gradient(circle at center, #0e4d2a 0%, #062612 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية جمالية خفيفة لإعطاء طابع الفخامة */
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(rgba(214, 175, 55, 0.05) 1px, transparent 0);
            background-size: 24px 24px;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* حاوية المحتوى الرئيسية */
        .wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 650px;
            padding: 20px;
            text-align: center;
        }

        /* ترويسة الموقع */
        .header-section {
            margin-bottom: 35px;
            animation: fadeInDown 1s ease-out;
        }

        /* تنسيق شعار الواجهة المضاف يدوياً */
        .top-logo-img {
            max-width: 140px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.5));
        }

        /* اسم الدولة بالخط العربي المزخرف الفخم (خط أميري) */
        .country-title {
            font-family: 'Amiri', serif;
            font-size: 3.8rem;
            font-weight: 700;
            color: #cda231;
            text-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5), 0 0 30px rgba(205, 162, 49, 0.3);
            margin-bottom: 2px;
            line-height: 1.2;
        }

        /* اسم الإدارة */
        .dept-title {
            font-size: 1.5rem;
            font-weight: 500;
            color: #e2e8f0;
            letter-spacing: 1px;
            position: relative;
            display: inline-block;
            padding-bottom: 10px;
        }

        .dept-title::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 25%;
            width: 50%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #cda231, transparent);
        }

        /* الصندوق الاحترافي للتحقق */
        .card-verification {
            background: rgba(10, 45, 25, 0.65);
            border: 1px solid rgba(205, 162, 49, 0.4);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            animation: fadeInUp 1s ease-out;
        }

        .card-heading {
            font-size: 1.35rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* تصميم الزر المطور تفاعلياً */
        .btn-verify {
            background: linear-gradient(135deg, #cda231 0%, #a47e22 100%);
            color: #062612;
            border: none;
            padding: 16px 45px;
            font-size: 1.15rem;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(205, 162, 49, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
        }

        .btn-verify:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(205, 162, 49, 0.5);
            background: linear-gradient(135deg, #ebd076 0%, #cda231 100%);
        }

        /* صندوق إظهار الوثيقة بعد التحقق الناجح */
        .document-box {
            display: none;
            margin-top: 30px;
            padding: 25px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #cda231;
            border-radius: 12px;
            animation: scaleIn 0.4s ease-out forwards;
        }

        .document-status {
            font-size: 1.1rem;
            color: #4ade80;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .document-content {
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .document-content img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* حركات الأنيميشن لجعل الموقع حيوياً واحترافياً */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-3px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- ترويسة الصفحة -->
        <div class="header-section">
            <!-- هنا تم إضافة كود الشعار الخاص بك في الواجهة يدوياً -->
            <img src="logo.jpg" alt="شعار النظام" class="top-logo-img">


            
            <h1 class="country-title">المملكة العربية السعودية</h1>
            <h2 class="dept-title">إدارة الشؤون الاجتماعية</h2>
        </div>

        <!-- صندوق نظام التحقق -->
        <div class="card-verification">
            <div class="card-heading">نظام التحقق من الوثائق والمستندات الرسمية</div>
            
            <!-- الزر المطلوب بدقة -->
            <button class="btn-verify" onclick="checkAccessPassword()">اضغط لإظهار الوثيقة الخاصة بك</button>
            
            <!-- مكان عرض الوثيقة بعد إدخال الباسوورد الصحيح -->
            <div id="secureDocumentArea" class="document-box">
                <div class="document-status">✓ تم التحقق بنجاح - مصرح بالوصول</div>
                <div class="document-content">
                    <!-- تأكد من وضع ملف وثيقتك بنفس هذا الاسم والامتداد في المجلد -->
                    <img src="document.png" alt="الوثيقة الرسمية">
                </div>
            </div>
        </div>
    </div>

    <script>
        function checkAccessPassword() {
            const correctPassword = "Alesar040101"; 
            let userEntered = prompt("يرجى إدخال كلمة المرور المعتمدة للوصول إلى الوثيقة:");
            
            if (userEntered === correctPassword) {
                document.getElementById("secureDocumentArea").style.display = "block";
            } else if (userEntered !== null) {
                alert("كلمة المرور غير صحيحة! يرجى إعادة المحاولة.");
            }
        }
    </script>

</body>
</html>
